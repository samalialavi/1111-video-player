<!doctype html>
<html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11:11 Video Player</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:white;font-family:Arial}body{overflow:hidden;cursor:none}video{width:100%;height:100%;object-fit:contain;visibility:hidden}video.is-playing{visibility:visible}#panel[hidden]{display:none}body.settings-open{cursor:auto}button:focus{outline:3px solid #ff3b30}#panel{position:fixed;bottom:15px;right:15px;padding:12px;background:#151515dd;border-radius:10px;font-size:14px}button{padding:10px;margin:4px;border:0;border-radius:6px;cursor:pointer}#message{max-width:75vw}</style>
<video id="video" playsinline preload="auto"></video>
<div id="panel" hidden role="dialog" aria-label="Player settings"><div id="message">Connecting…</div><button id="sound">Enable sound</button><button id="fullscreen">Fullscreen</button><button id="close">Close settings</button></div>
<script>
// REQUIRED: paste the Production URL from the n8n Kiosk Player Poll node here.
const ENDPOINT='https://n8n.sam.ge/webhook/kiosk-player';
const KEY="rSe67zkCJHGskLCGacW5ngBvkSusEgMI1aHuIMBt2YM";
const video=document.getElementById('video'),message=document.getElementById('message'),panel=document.getElementById('panel');
const VIDEOS = {
 v1: 'https://samalialavi.github.io/1111-video-player/videos/video1.mp4',
 v2: 'https://samalialavi.github.io/1111-video-player/videos/video2.mp4',
 v3: 'https://samalialavi.github.io/1111-video-player/videos/video3.mp4'
};
let lastId='',selected='',busy=false,initialized=false;
const SOUND_SETTING='1111-player-sound-enabled-v2';
let soundEnabled=true;
try{soundEnabled=localStorage.getItem(SOUND_SETTING)!=='false';}catch(e){}
video.muted=!soundEnabled;
function updateSoundButton(){document.getElementById('sound').textContent=soundEnabled?'Disable sound':'Enable sound';}
updateSoundButton();
// Common red-button mappings. Your kiosk app must forward remote keys to the page.
const RED_KEY_CODES = [403, 183];
const show=text=>{message.textContent=text;};
const showError=text=>{show(text);toggleSettings(true);};
function toggleSettings(open=panel.hidden){
 panel.hidden=!open;
 document.body.classList.toggle('settings-open',open);
 if(open)document.getElementById('sound').focus();
 else document.activeElement?.blur();
}
document.getElementById('close').onclick=()=>toggleSettings(false);
let okTimer=null;
document.addEventListener('keydown',event=>{
 if(event.key==='ColorF0Red' || RED_KEY_CODES.includes(event.keyCode) || event.code==='KeyR'){
  event.preventDefault();if(!event.repeat)toggleSettings();return;
 }
 if(!panel.hidden && (event.key==='Escape' || event.key==='BrowserBack')){
  event.preventDefault();toggleSettings(false);return;
 }
 if(panel.hidden && event.key==='Enter' && !event.repeat){
  okTimer=setTimeout(()=>{okTimer=null;toggleSettings(true);},1500);
 }
});
document.addEventListener('keyup',event=>{if(event.key==='Enter'){clearTimeout(okTimer);okTimer=null;}});
window.addEventListener('blur',()=>{clearTimeout(okTimer);okTimer=null;});
function blackScreen(){video.classList.remove('is-playing');}
video.addEventListener('playing',()=>video.classList.add('is-playing'));
video.addEventListener('waiting',blackScreen);
video.addEventListener('stalled',blackScreen);

document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>show('Enable fullscreen in your kiosk app settings'));
document.getElementById('sound').onclick=()=>{
 soundEnabled=!soundEnabled;
 video.muted=!soundEnabled;
 try{localStorage.setItem(SOUND_SETTING,String(soundEnabled));}
 catch(e){show('Browser storage is unavailable; sound preference cannot be saved.');updateSoundButton();return;}
 updateSoundButton();
 show(soundEnabled?'Sound enabled and saved':'Sound disabled and saved');
};
video.addEventListener('ended',()=>{blackScreen();show('Ready for commands');});
video.addEventListener('error',()=>{blackScreen();showError('Video error '+(video.error?.code || '')+': '+(video.currentSrc || 'No URL'));});
async function apply(c){
 if(!c || c.ok!==true || typeof c.commandId!=='string')throw Error('Invalid player response: expected ok and commandId');
 // First successful response is a baseline, never a playback request.
 // Reset this baseline on each page load, even when the server has an old play command.
 if(!initialized){initialized=true;lastId=c.commandId;blackScreen();show('Connected; ready for a new command');return;}
 if(c.commandId===lastId)return;
 if(c.action==='stop'){blackScreen();video.pause();try{video.currentTime=0}catch(e){};lastId=c.commandId;show('Ready for commands');return;}
 if(!['play','replay'].includes(c.action))return;
 blackScreen();
 const candidate=c.url && !/YOUR-USER|YOUR-REPO/.test(c.url)?c.url:VIDEOS[c.videoId];
 if(!candidate)throw Error('No video URL configured');
 const url=new URL(candidate);if(!['https:','http:'].includes(url.protocol))throw Error('Invalid video URL');
 if(selected!==url.href){selected=url.href;video.src=selected;video.load();}
 video.currentTime=0;
 try{await video.play();}
 catch(error){
  if(error.name!=='NotAllowedError')throw error;
  video.muted=true;
  await video.play();
  showError('Playback started muted. Enable autoplay with sound in the kiosk settings.');
 }
 lastId=c.commandId;
}
async function poll(){
 if(busy)return;busy=true;
 const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),8000);
 try{
  const url=new URL(ENDPOINT);url.searchParams.set('key',KEY);
  const response=await fetch(url,{cache:'no-store',signal:abort.signal});
  if(!response.ok)throw Error('HTTP '+response.status);
  await apply(await response.json());
  if(video.paused && !video.error)show('Connected; ready for commands');
 }catch(e){showError('Connection or playback error: '+e.message+' — retrying automatically');}
 finally{clearTimeout(timer);busy=false;setTimeout(poll,1000)}
}
if (ENDPOINT.includes('YOUR-N8N-DOMAIN')) {
 show('Setup required: set ENDPOINT to your n8n Production Webhook URL in this HTML file.');
} else {
 poll();
}
</script></html>
